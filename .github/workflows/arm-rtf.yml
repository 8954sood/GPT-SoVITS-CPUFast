name: ARM RTF benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Full audio comparison or targeted diagnostics
        type: choice
        options: ['compare', 'diagnostics', 'attention', 'small', 'scheduling', 'packed48', 'fft', 'fftcandidate', 'arcache', 'prefetch', 'prefetchcandidate', 'winograd', 'direct3', 'locality', 'fftstream', 'transforms', 'inference', 'runtime', 'student', 'studentpredictor', 'studentcompare', 'studentcomparecached', 'studentdecoder', 'taptiles']
        default: 'compare'
      warmups:
        description: Excluded warmup runs (1–5)
        type: choice
        options: ['1', '2', '3']
        default: '2'
      samples:
        description: Measured runs (1–20)
        type: choice
        options: ['1', '3', '5']
        default: '3'

      student_repo:
        description: Private HF model repository (student mode only)
        type: string
        default: ''
      student_revision:
        description: Full immutable HF commit SHA (student mode only)
        type: string
        default: ''
      student_manifest_path:
        description: Relative approved manifest path in HF repository
        type: string
        default: 'approved-g-20261112/manifest.json'
      student_manifest_sha256:
        description: Trusted approved manifest SHA256 (student mode only)
        type: string
        default: ''

      student_prefetch:
        description: Fixed previously measured prefetch for studentpredictor mode
        type: choice
        options: ['0', '64', '128', '256']
        default: '0'

      comparison_manifest_path:
        description: Approved baseline manifest in the same pinned HF revision (comparison modes)
        type: string
        default: ''
      comparison_manifest_sha256:
        description: Trusted baseline manifest SHA256 (comparison modes)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: cpufast-arm-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned private asset downloader
        if: startsWith(inputs.mode, 'student')
        shell: bash
        run: python3 -m pip install --quiet --disable-pip-version-check --no-compile --target "$RUNNER_TEMP/student-python" 'huggingface_hub==0.36.2'
      - name: Run benchmark on ARM host
        env:
          ARM_HOST: ${{ secrets.ARM_SSH_HOST }}
          ARM_USER: ${{ secrets.ARM_SSH_USER }}
          ARM_PRIVATE_KEY: ${{ secrets.ARM_SSH_PRIVATE_KEY }}
          ARM_PASSPHRASE: ${{ secrets.ARM_SSH_PASSPHRASE }}
          ARM_KNOWN_HOSTS: ${{ secrets.ARM_SSH_KNOWN_HOSTS }}
          ARM_BENCH_ROOT: ${{ vars.ARM_BENCH_ROOT }}
          ARM_BENCH_IMAGE: ${{ vars.ARM_BENCH_IMAGE }}
          ARM_BENCH_MEMORY: ${{ vars.ARM_BENCH_MEMORY }}
          ARM_BENCH_CPUS: ${{ vars.ARM_BENCH_CPUS }}
          MODE: ${{ inputs.mode }}
          COMPARISON_MANIFEST_PATH: ${{ inputs.comparison_manifest_path }}
          COMPARISON_MANIFEST_SHA256: ${{ inputs.comparison_manifest_sha256 }}
          STUDENT_PREFETCH: ${{ inputs.student_prefetch }}
          HF_STUDENT_TOKEN: ${{ secrets.HF_STUDENT_TOKEN }}
          HF_STUDENT_REPO: ${{ inputs.student_repo }}
          HF_STUDENT_REVISION: ${{ inputs.student_revision }}
          HF_STUDENT_MANIFEST_PATH: ${{ inputs.student_manifest_path }}
          HF_STUDENT_MANIFEST_SHA256: ${{ inputs.student_manifest_sha256 }}
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
          HF_HOME: ${{ runner.temp }}/hf-private-home
          WARMUPS: ${{ inputs.warmups }}
          SAMPLES: ${{ inputs.samples }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ARM_HOST:?Missing ARM_SSH_HOST secret}" "${ARM_USER:?Missing ARM_SSH_USER secret}" "${ARM_PRIVATE_KEY:?Missing ARM_SSH_PRIVATE_KEY secret}" "${ARM_KNOWN_HOSTS:?Missing ARM_SSH_KNOWN_HOSTS secret}"
          [[ "$ARM_HOST" =~ ^[A-Za-z0-9._-]+$ && "$ARM_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "Invalid SSH host or user format" >&2; exit 1; }
          [[ "$MODE" == compare || "$MODE" == diagnostics || "$MODE" == attention || "$MODE" == small || "$MODE" == scheduling || "$MODE" == packed48 || "$MODE" == fft || "$MODE" == fftcandidate || "$MODE" == arcache || "$MODE" == prefetch || "$MODE" == prefetchcandidate || "$MODE" == winograd || "$MODE" == direct3 || "$MODE" == locality || "$MODE" == fftstream || "$MODE" == transforms || "$MODE" == inference || "$MODE" == runtime || "$MODE" == student || "$MODE" == studentpredictor || "$MODE" == studentcompare || "$MODE" == studentcomparecached || "$MODE" == studentdecoder || "$MODE" == taptiles ]] || { echo "Invalid mode" >&2; exit 1; }
          [[ "$WARMUPS" =~ ^[1-5]$ && "$SAMPLES" =~ ^([1-9]|1[0-9]|20)$ ]] || { echo "Invalid sample counts" >&2; exit 1; }
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || { echo "Invalid run identifier" >&2; exit 1; }
          umask 077
          printf '%s\n' "$ARM_PRIVATE_KEY" > "$RUNNER_TEMP/arm_key"
          printf '%s\n' "$ARM_KNOWN_HOSTS" > "$RUNNER_TEMP/arm_known_hosts"
          cat > "$RUNNER_TEMP/arm_askpass" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$ARM_PASSPHRASE"
          EOF
          chmod 700 "$RUNNER_TEMP/arm_askpass"
          export SSH_ASKPASS="$RUNNER_TEMP/arm_askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          ssh_args=(-i "$RUNNER_TEMP/arm_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/arm_known_hosts" -o ServerAliveInterval=15 -o ConnectTimeout=20)
          target="$ARM_USER@$ARM_HOST"
          remote_rel=".cache/cpufast-actions/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_remote() { ssh "${ssh_args[@]}" "$target" "rm -rf \"\$HOME/$remote_rel\"" || true; }
          trap cleanup_remote EXIT
          ssh "${ssh_args[@]}" "$target" "mkdir -p \"\$HOME/$remote_rel\""
          git archive "$GITHUB_SHA" | ssh "${ssh_args[@]}" "$target" "tar -x -C \"\$HOME/$remote_rel\""
          if [[ "$MODE" == student || "$MODE" == studentpredictor || "$MODE" == studentcompare || "$MODE" == studentcomparecached || "$MODE" == studentdecoder ]]; then
            export PYTHONPATH="$GITHUB_WORKSPACE:$RUNNER_TEMP/student-python"
            prepare_bundle() {
              local bundle_path=$1 bundle_sha=$2
              [[ "$bundle_sha" =~ ^[0-9a-f]{64}$ && "$HF_STUDENT_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Pinned student manifest/revision required' >&2; exit 1; }
              local bundle_dir="$RUNNER_TEMP/private_student/$bundle_sha"
              HF_STUDENT_MANIFEST_PATH="$bundle_path" HF_STUDENT_MANIFEST_SHA256="$bundle_sha" python3 scripts/download_student_assets.py --output "$bundle_dir" --manifest-only
              local asset_args
              printf -v asset_args ' %q' "${ARM_BENCH_ROOT:-}" "$bundle_sha"
              if ! ssh "${ssh_args[@]}" "$target" "bash \"\$HOME/$remote_rel/scripts/prepare_student_assets.sh\"$asset_args verify"; then
                HF_STUDENT_MANIFEST_PATH="$bundle_path" HF_STUDENT_MANIFEST_SHA256="$bundle_sha" python3 scripts/download_student_assets.py --output "$bundle_dir"
                ssh "${ssh_args[@]}" "$target" "umask 077 && mkdir -p \"\$HOME/$remote_rel/.private-student-upload\" && chmod 700 \"\$HOME/$remote_rel/.private-student-upload\""
                for name in manifest.json ar.pt decoder.pt student_spec.json; do
                  scp "${ssh_args[@]}" "$bundle_dir/$name" "$target:$remote_rel/.private-student-upload/$name"
                done
                ssh "${ssh_args[@]}" "$target" "bash \"\$HOME/$remote_rel/scripts/prepare_student_assets.sh\"$asset_args install"
              fi
            }
            prepare_bundle "$HF_STUDENT_MANIFEST_PATH" "$HF_STUDENT_MANIFEST_SHA256"
            if [[ "$MODE" == studentcompare || "$MODE" == studentcomparecached || "$MODE" == studentdecoder ]]; then
              prepare_bundle "$COMPARISON_MANIFEST_PATH" "$COMPARISON_MANIFEST_SHA256"
            fi
          fi
          printf -v benchmark_args ' %q' "${ARM_BENCH_ROOT:-}" "${ARM_BENCH_IMAGE:-}" "${ARM_BENCH_MEMORY:-}" "${ARM_BENCH_CPUS:-}" "$WARMUPS" "$SAMPLES" "$MODE" "${HF_STUDENT_MANIFEST_SHA256:-}" "${STUDENT_PREFETCH:-0}" "${COMPARISON_MANIFEST_SHA256:-}"
          benchmark_status=0
          ssh "${ssh_args[@]}" "$target" "bash \"\$HOME/$remote_rel/scripts/run_arm_benchmark.sh\"$benchmark_args" || benchmark_status=$?
          mkdir -p ci-artifact
          scp "${ssh_args[@]}" "$target:$remote_rel/ci-results/*.json" ci-artifact/ || true
          scp "${ssh_args[@]}" "$target:$remote_rel/ci-results/*.wav" ci-artifact/ || true
          if (( benchmark_status != 0 )); then
            echo "ARM benchmark failed with exit code $benchmark_status; retaining available reports."
            exit "$benchmark_status"
          fi
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          import os
          if os.environ['MODE'].startswith('student'):
              d = json.loads(Path('ci-artifact/student_summary.json').read_text())
              print('### Actual N1 approved student performance')
              print('Korean listening approval only; JA/EN are performance/synthesis checks.')
              for row in d['cases']:
                  print(f"- {row['language']} / {row['name']}: median RTF **{row['median_rtf']:.4f}**, duration {row['audio_seconds']:.2f}s")
              print(f"- Selected provisional FP32-cache prefetch: {d.get('selected_prefetch')}")
              if not d.get('complete') or not d.get('student_assets_unchanged'):
                  raise SystemExit('Incomplete student verification')
              if os.environ['MODE'] == 'studentdecoder':
                  probe = json.loads(Path('ci-artifact/tap_tiles.json').read_text())
                  print('- Sequential tap tiling probe: synthetic only, excluded from model RTF.')
                  if not probe.get('complete') or not all(r['finite'] and r['coefficients_unchanged'] for r in probe['rows']):
                      raise SystemExit('Incomplete/invalid tap probe')
              raise SystemExit(0)
          if os.environ['MODE'] == 'taptiles':
              d = json.loads(Path('ci-artifact/tap_tiles.json').read_text())
              print('### Actual N1 synthetic temporal tap tiles')
              for row in d['rows']:
                  print(f"- C{row['channels']} K{row['kernel']} D{row['dilation']} tile{row['tile']}: {row['median_seconds']:.6f}s, exact={row['exact']}, max_abs={row['max_abs_error']}")
              print('Synthetic FP32 output checks only; no full TTS/PCM/quality claim.')
              if not d.get('complete') or not all(r['finite'] and r['coefficients_unchanged'] for r in d['rows']):
                  raise SystemExit('Incomplete/invalid tap probe')
              raise SystemExit(0)
          if os.environ['MODE'] == 'runtime':
              print('### ARM original FP32 runtime verification')
              for n in (1, 2):
                  for name in ('baseline', 'parallel', 'inference', 'combined'):
                      d = json.loads(Path(f'ci-artifact/{name}_{n}.json').read_text())
                      print(f"- Sentence {n}, {name}: median **{d['median_rtf']:.4f}**, " + ', '.join(f"{r['rtf']:.4f}" for r in d['runs']))
                      if not all(d.get(k) for k in ('checkpoint_files_unchanged', 'parameters_unchanged', 'ar_parameters_unchanged')):
                          raise SystemExit('Parameter integrity verification failed')
              print('Combined performance is measured directly; individual gains must not be added.')
              raise SystemExit(0)
          if os.environ['MODE'] == 'diagnostics':
              d = json.loads(Path('ci-artifact/profile_run.json').read_text())
              print('### ARM 2-vCPU FP32 diagnostics')
              print(f"- Unprofiled tap run median RTF: {d['median_rtf']:.4f}; profiling is a separate invocation.")
              print('- Operator profile and synthetic kernel timing details are in the JSON artifacts.')
              if not all(d.get(k) for k in ('checkpoint_files_unchanged', 'parameters_unchanged', 'ar_parameters_unchanged')):
                  raise SystemExit('Parameter integrity verification failed')
              raise SystemExit(0)
          if os.environ['MODE'] == 'locality':
              d = json.loads(Path('ci-artifact/ar_locality.json').read_text())
              print('### ARM FP32 AR prefetch locality probe')
              for row in d['cases']:
                  print(f"- Locality {row['locality']}: {row['median_seconds_per_token']:.5f}s per synthetic token")
              print('Synthetic traversal, not full synthesis RTF.')
              raise SystemExit(0)
          if os.environ['MODE'] == 'winograd':
              d = json.loads(Path('ci-artifact/winograd_methods.json').read_text())
              print('### ARM FP32 synthetic three-tap convolution probe')
              for row in d['cases']:
                  print(f"- {row['channels']} channels, dilation {row['dilation']}, {row['method']}: {row['median_seconds']:.4f}s")
              print('These are synthetic timings, not speech RTF.')
              raise SystemExit(0)
          if os.environ['MODE'] == 'prefetch':
              d = json.loads(Path('ci-artifact/ar_prefetch.json').read_text())
              print('### ARM FP32 AR model-sized prefetch probe')
              for row in d['cases']:
                  print(f"- Distance {row['distance']}: {row['median_seconds_per_token']:.5f}s per synthetic token")
              print('Synthetic traversal, not full synthesis RTF.')
              raise SystemExit(0)
          if os.environ['MODE'] == 'fft':
              d = json.loads(Path('ci-artifact/fft_sizes.json').read_text())
              print('### ARM FP32 synthetic FFT size probe')
              for row in d['cases']:
                  print(f"- {row['channels']} channels, kernel {row['kernel']}, FFT {row['n_fft']}: {row['median_seconds']:.4f}s")
              print('These are synthetic timings, not speech RTF.')
              raise SystemExit(0)
          if os.environ['MODE'] == 'scheduling':
              print('### ARM FP32 thread wait comparison')
              for name in ('active', 'passive'):
                  d = json.loads(Path(f'ci-artifact/{name}.json').read_text())
                  print(f"- {name}: median **{d['median_rtf']:.4f}**, " + ', '.join(f"{r['rtf']:.4f}" for r in d['runs']))
                  if not all(d.get(k) for k in ('checkpoint_files_unchanged', 'parameters_unchanged', 'ar_parameters_unchanged')):
                      raise SystemExit('Parameter integrity verification failed')
              raise SystemExit(0)
          if os.environ['MODE'] == 'small':
              d = json.loads(Path('ci-artifact/decoder_small.json').read_text())
              print('### ARM FP32 small-channel synthetic convolution probe')
              for row in d['cases']:
                  print(f"- {row['channels']} channels, kernel {row['kernel']}, {row['method']}: {row['median_seconds']:.4f}s")
              print('These are synthetic timings, not speech RTF.')
              raise SystemExit(0)
          if os.environ['MODE'] in ('attention', 'packed48', 'fftcandidate', 'arcache', 'prefetchcandidate', 'direct3', 'fftstream', 'transforms', 'inference'):
              print('### ARM 2-vCPU FP32 candidate comparison')
              for n in (1, 2):
                  for name in ('tap', 'attention'):
                      d = json.loads(Path(f'ci-artifact/{name}_{n}.json').read_text())
                      print(f"- Sentence {n}, {name}: median **{d['median_rtf']:.4f}**, " + ', '.join(f"{r['rtf']:.4f}" for r in d['runs']))
                      if not all(d.get(k) for k in ('checkpoint_files_unchanged', 'parameters_unchanged', 'ar_parameters_unchanged')):
                          raise SystemExit('Parameter integrity verification failed')
              raise SystemExit(0)
          print('### ARM 2-vCPU FP32 comparison')
          print('RTF is synthesis wall time divided by audio duration; warmups and all measured runs are recorded.')
          for n in (1, 2):
              for name in ('baseline', 'tap'):
                  d = json.loads(Path(f'ci-artifact/{name}_{n}.json').read_text())
                  print(f"- Sentence {n}, {name}: median **{d['median_rtf']:.4f}**, "
                        + 'runs ' + ', '.join(f"{r['rtf']:.4f}" for r in d['runs']))
                  if not all(d.get(k) for k in ('checkpoint_files_unchanged', 'parameters_unchanged', 'ar_parameters_unchanged')):
                      raise SystemExit('Parameter integrity verification failed')
          print('Generated WAV files are included for listening; the input reference is not uploaded.')
          PY
      - name: Upload measurements and generated audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-rtf-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifact/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove local SSH credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/arm_key" "$RUNNER_TEMP/arm_known_hosts" "$RUNNER_TEMP/arm_askpass"
          rm -rf "$RUNNER_TEMP/private_student" "$RUNNER_TEMP/student-python" "$RUNNER_TEMP/hf-private-home"
